name: Build XY-OPTIMIZATION

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Also lets you build manually from the GitHub website
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 - Install Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3 - Build the JAR with Maven
      - name: Build with Maven
        run: mvn clean package -B

      # Step 4 - Upload the JAR so you can download it
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: XY-OPTIMIZATION-${{ github.run_number }}
          path: target/XY-OPTIMIZATION-*.jar
          if-no-files-found: error
